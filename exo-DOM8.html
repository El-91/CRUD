<!DOCTYPE html>    
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Example</title> 
</head>
<body>

<nav>
  <a href="#" id="ajoutBtn">ajout visiteur</a>
  <a href="#" id="ajoutProfBtn">ajouter Professeur</a>
  <a href="#" id="listBtn">liste utilisateurs</a>
  <a href="#" id="dashBtn">dashboard</a>
</nav>

<form id="formVisiteur">
    <h3>Inscription Visiteur</h3>
    <input type="text" id="username" placeholder="nom visiteur" required>
    <input type="email" id="email" placeholder="email visiteur" required>
    <input type="number" id="age" placeholder="age visiteur" required>
    <input type="text" id="identifiant" placeholder="id visiteur" required>
    <button type="submit">inscription visiteur</button>
    <button type="reset">reset</button>
</form>

<form id="formProf" style="display:none;">
    <h3>Inscription Professeur</h3>
    <input type="text" id="p_username" placeholder="nom prof" required>
    <input type="email" id="p_email" placeholder="email prof" required>
    <input type="number" id="p_age" placeholder="age prof" required>
    <input type="text" id="p_identifiant" placeholder="id prof" required>
    <button type="submit">inscription professeur</button>
    <button type="reset">reset</button>
</form>

<div id="userListContainer" style="display:none;">
    <h2>Liste des inscrits</h2>
    <ul id="userList"></ul>
    <button id="resetlist">effacer tout</button>
</div>

<div id="dashboardContainer" style="display:none;">
    <h2>Dashboard</h2>
    visiteurs : <span id="userCount">0</span><br>
    professeurs : <span id="professorCount">0</span><br>
    <strong>Total : <span id="totalCount">0</span></strong>
</div>

<script>
const fVisiteur = document.getElementById("formVisiteur");
const fProf = document.getElementById("formProf");
const listCont = document.getElementById("userListContainer");
const dashCont = document.getElementById("dashboardContainer");

const utilisateurs = [];
const professeurs = [];

[fVisiteur, fProf].forEach(f => {
    f.style.width = "250px";
    f.style.padding = "10px";
    f.querySelectorAll("input").forEach(i => {
        i.style.display = "block";
        i.style.marginBottom = "10px";
        i.style.width = "100%";
    });
});


document.getElementById("ajoutBtn").addEventListener("click", () => {
    showSection(fVisiteur);
});

document.getElementById("ajoutProfBtn").addEventListener("click", () => {
    showSection(fProf);
});

document.getElementById("listBtn").addEventListener("click", () => {
    showSection(listCont);
    const ul = document.getElementById("userList");
    ul.innerHTML = "";
    utilisateurs.forEach(u => (ul.innerHTML += `<li>[Visiteur] ${u.username}</li>`));
    professeurs.forEach(p => (ul.innerHTML += `<li>[Prof] ${p.username}</li>`));
});

document.getElementById("dashBtn").addEventListener("click", () => {
    showSection(dashCont);
    document.getElementById("userCount").textContent = utilisateurs.length;
    document.getElementById("professorCount").textContent = professeurs.length;
    document.getElementById("totalCount").textContent = utilisateurs.length + professeurs.length;
});

function showSection(section) {
    [fVisiteur, fProf, listCont, dashCont].forEach(s => s.style.display = "none");
    section.style.display = "block";
}


fVisiteur.addEventListener("submit", (e) => {
    e.preventDefault();
    utilisateurs.push({
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        age: document.getElementById("age").value,
        identifiant: document.getElementById("identifiant").value
    });
    alert("Visiteur enregistré");
    fVisiteur.reset();
});


fProf.addEventListener("submit", (e) => {
    e.preventDefault();
    professeurs.push({
        username: document.getElementById("p_username").value,
        email: document.getElementById("p_email").value,
        age: document.getElementById("p_age").value,
        identifiant: document.getElementById("p_identifiant").value
    });
    alert("Professeur enregistré");
    fProf.reset();
});

document.getElementById("resetlist").addEventListener("click", () => {
    utilisateurs.length = 0;
    professeurs.length = 0;
    document.getElementById("userList").innerHTML = "";
});
</script>
</body>
</html>
