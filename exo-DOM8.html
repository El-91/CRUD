<!DOCTYPE html>    
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Example</title> 
</head>
<body>

<nav>
  <a href="#" id="ajoutBtn">ajout visiteur</a>
  <a href="#" id="ajoutProfBtn">ajouter Professeur</a>
  <a href="#" id="listBtn">liste utilisateurs</a>
  <a href="#" id="dashBtn">dashboard</a>
</nav>

<form>
    <h3 id="formTitle">Inscription Visiteur</h3>
    <input type="text" id="username" placeholder="votre nom" required>
    <input type="email" id="email" placeholder="votre email" required>
    <input type="number" id="age" placeholder="votre age" required>
    <input type="text" id="identifiant" placeholder="votre identifiant" required>
    <button class="save">inscription</button>
    <button type="button" id="reset">reset</button>
</form>

<div id="userListContainer" style="display:none;">
    <h2>Liste des inscrits</h2>
    <ul id="userList"></ul>
    <button id="resetlist">effacer</button>
</div>

<div id="dashboardContainer" style="display:none;">
    <h2>Dashboard</h2>
    visiteurs : <span id="userCount">0</span><br>
    professeurs : <span id="professorCount">0</span>
</div>

<script>
const form = document.querySelector("form");
const formTitle = document.getElementById("formTitle");
const utilisateurs = [];
const professeurs = [];
let estProf = false;

form.style.width = "200px";
form.style.padding = "10px";
form.querySelectorAll("input").forEach(i => {
    i.style.display = "block";
    i.style.marginBottom = "10px";
    i.style.width = "100%";
});

document.getElementById("ajoutBtn").addEventListener("click", () => {
    form.style.display = "block";
    formTitle.textContent = "Inscription Visiteur";
    estProf = false;
    document.getElementById("userListContainer").style.display = "none";
    document.getElementById("dashboardContainer").style.display = "none";
});

document.getElementById("ajoutProfBtn").addEventListener("click", () => {
    form.style.display = "block";
    formTitle.textContent = "Inscription Professeur";
    estProf = true;
    document.getElementById("userListContainer").style.display = "none";
    document.getElementById("dashboardContainer").style.display = "none";
});

document.querySelector(".save").addEventListener("click", (e) => {
    e.preventDefault();
    const data = {
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        age: document.getElementById("age").value,
        identifiant: document.getElementById("identifiant").value
    };

    if(data.username && data.email && data.age && data.identifiant) {
        if(estProf) {
            professeurs.push(data);
            alert("Professeur ajouté !");
        } else {
            utilisateurs.push(data);
            alert("Visiteur ajouté !");
        }
        form.reset();
    } else {
        alert("Remplissez tout !");
    }
});

document.getElementById("listBtn").addEventListener("click", () => {
    form.style.display = "none";
    document.getElementById("dashboardContainer").style.display = "none";
    document.getElementById("userListContainer").style.display = "block";
    const ul = document.getElementById("userList");
    ul.innerHTML = "";
    
    utilisateurs.forEach(u => {
        const li = document.createElement("li");
        li.textContent = `[Visiteur] ${u.username}`;
        ul.appendChild(li);
    });
    professeurs.forEach(p => {
        const li = document.createElement("li");
        li.textContent = `[Prof] ${p.username}`;
        ul.appendChild(li);
    });
});

document.getElementById("dashBtn").addEventListener("click", () => {
    form.style.display = "none";
    document.getElementById("userListContainer").style.display = "none";
    document.getElementById("dashboardContainer").style.display = "block";
    document.getElementById("userCount").textContent = utilisateurs.length;
    document.getElementById("professorCount").textContent = professeurs.length;
});

document.getElementById("reset").addEventListener("click", () => form.reset());

document.getElementById("resetlist").addEventListener("click", () => {
    utilisateurs.length = 0;
    professeurs.length = 0;
    document.getElementById("userList").innerHTML = "";
});
</script>
</body>
</html>
